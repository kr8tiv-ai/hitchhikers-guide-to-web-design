# Playwright end-to-end tests on Linux. No deploy. No publish.
name: E2E

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::No pnpm-lock.yaml yet. Falling back to pnpm install."
            pnpm install
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'packages/app/package.json') }}

      - name: Install Playwright Chromium
        shell: bash
        run: |
          if ! pnpm --filter @hitchhiker/app exec playwright --version; then
            echo "::warning::Playwright is not installed in @hitchhiker/app yet. Skipping the Chromium download."
            exit 0
          fi
          # A third-party apt source must not fail this job. packages.microsoft.com
          # has returned 403 during `playwright install --with-deps` and aborted apt.
          if [ -d /etc/apt/sources.list.d ]; then
            for list in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$list" ] || continue
              if grep -q 'packages.microsoft.com' "$list"; then
                sudo mv "$list" "${list}.disabled"
                echo "Disabled apt source ${list} (packages.microsoft.com)."
              fi
            done
          fi
          ok=0
          for attempt in 1 2 3; do
            if pnpm --filter @hitchhiker/app exec playwright install --with-deps chromium; then
              ok=1
              break
            fi
            echo "Playwright Chromium install attempt ${attempt} failed."
            sleep $((attempt * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Playwright Chromium did not install after 3 attempts. A third-party apt source must not be required. Check the install log above."
            exit 1
          fi

      - name: End-to-end tests
        run: pnpm -r run --if-present e2e
