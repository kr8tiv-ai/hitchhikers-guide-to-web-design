# Publish hitchhikers-guide only after CI and the pack smoke.
# Starts from a hand click (workflow_dispatch) or a v* tag.
# An ordinary branch push does not run this file and does not publish.
# This file does not create a version tag and does not open a GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to send hitchhikers-guide to npm. Anything else publishes nothing.
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  confirm:
    name: Confirm publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a hand start that did not say publish
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'publish'
        run: |
          echo "Type publish in the confirm box. Nothing was sent to npm."
          exit 1

      - name: Record the release gate
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.confirm == 'publish'
        run: echo "CI and the pack smoke run next. Publishing waits until both pass."

  ci:
    name: CI
    needs: [confirm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::No pnpm-lock.yaml yet. Falling back to pnpm install."
            pnpm install
          fi

      - name: Lint
        run: pnpm -r run --if-present lint

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Unit tests
        run: pnpm -r test
        env:
          HH_CASSETTE: replay

      - name: Evals from cassettes
        run: pnpm -r run --if-present eval
        env:
          HH_CASSETTE: replay

  pack-smoke:
    name: Pack smoke
    needs: [confirm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::No pnpm-lock.yaml yet. Falling back to pnpm install."
            pnpm install
          fi

      - name: Pack smoke
        run: node --experimental-strip-types --test packages/cli/test/pack-243.test.ts

  publish:
    name: Publish to npm
    needs: [ci, pack-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::No pnpm-lock.yaml yet. Falling back to pnpm install."
            pnpm install
          fi

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --provenance --access public
