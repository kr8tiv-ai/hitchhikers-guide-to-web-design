# Lint, typecheck, and unit tests. Cassette evals replay. No deploy. No publish.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Lint, typecheck, and unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::No pnpm-lock.yaml yet. Falling back to pnpm install."
            pnpm install
          fi

      - name: Lint
        run: pnpm -r run --if-present lint

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Unit tests
        run: pnpm -r test
        env:
          HH_CASSETTE: replay

      - name: Evals from cassettes
        run: pnpm -r run --if-present eval
        env:
          HH_CASSETTE: replay
