# Interview tree. Questions are data. The loader rejects a duplicate id or a missing field.
# Modules 0 through 9 live in this file. Do not renumber them.
# Express, Standard, and Deep filter this file. They are not separate trees.
# Guide Entry is not a question. It is renderBrief() in the engine.

questions:
  - id: DP-0.1
    module: towel-check
    depth: [express, standard, deep]
    ask: "Is this site for you, or for a client?"
    why: "A client job needs its own workspace and a brief you can hand over. Your own site does not."
    input: [choice, text, voice]
    skip_default: "For myself."
    suggest: "Yourself, or one named client."
    pushback_if:
      - "both"
      - "not sure"
    levels:
      beginner: explain
      pro: terse
    writes:
      - "PROJECT.md#audience"

  - id: DP-0.2
    module: towel-check
    depth: [express, standard, deep]
    ask: "Have you built a website before, and with what? Drop any URLs, including the old ones."
    why: "Prior sites and tools set your level. A URL can be crawled later for assets and for taste."
    input: [text, voice]
    skip_default: "No prior site. No builder named."
    suggest: "Name the tool, such as a site builder, Webflow, WordPress, Framer, or code, and paste a URL if one exists."
    required_for:
      - DP-0.2a
    writes:
      - "PROJECT.md#prior-sites"

  - id: DP-0.2a
    module: towel-check
    depth: [express, standard, deep]
    ask: "What do you love about that site, and what makes you wince?"
    why: "Love and wince are the taste signal. A crawl without them is only a screenshot."
    input: [text, voice]
    skip_default: "No prior site to love or wince at."
    suggest: "One thing to keep, and one thing that has to go."
    pushback_if:
      - "it's fine"
      - "nothing"
    writes:
      - "PROJECT.md#prior-sites"

  - id: DP-0.3
    module: towel-check
    depth: [express, standard, deep]
    ask: "How comfortable are you with web work? Four rungs: new to it, used a site builder, design or build sites, or write code."
    why: "The rung sets how much to explain. Technical vocabulary can move you up. Two asks of what a term means move you down."
    input: [choice, text, voice]
    skip_default: "New to it."
    suggest: "Pick the rung that matches the work you do."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "PROJECT.md#user-profile"

  - id: DP-0.4
    module: towel-check
    depth: [express, standard, deep]
    ask: "Do you already have brand assets: a logo, colors, fonts, a guide, or photos? Drop what you have. PDFs, screenshots, and links all work."
    why: "Existing assets open a fast path. Each field still gets a check for whether you are happy with it."
    input: [upload, text, voice]
    skip_default: "No brand assets yet."
    suggest: "Logo, palette, type, a written guide, and photos. Send any of them."
    writes:
      - "ASSETS.md#brand-assets"
      - "BRAND.md#imported"

  - id: DP-0.5
    module: towel-check
    # Express does not ask this. The id stays in the tree and the ASSUMED default is written.
    depth: [standard, deep]
    ask: "Want to connect your X account so the Guide can read your voice from posts? Optional, and read-only."
    why: "Posts can supply voice samples and imagery. Nothing is posted. Express does not ask this and writes the ASSUMED default."
    input: [choice, voice]
    skip_default: "No X connection."
    suggest: "Skip it if you would rather describe the voice yourself."
    writes:
      - "VOICE.md#x"

  - id: DP-0.6
    module: towel-check
    depth: [express, standard, deep]
    ask: "How do you want to answer: hold the mic, or use the keyboard?"
    why: "You can talk the whole way. The Guide replies in text either way."
    input: [choice, voice]
    skip_default: "Keyboard."
    suggest: "Mic if speaking is faster. Keyboard if you want to edit each line."
    writes:
      - "PROJECT.md#input-mode"

  - id: DP-0.7
    module: towel-check
    depth: [express, standard, deep]
    ask: "How much time do you have today? Choose a depth: Deep (the full Guide, recommended), Standard, or Express. The interview can be saved and resumed."
    why: "Every mode keeps every id. Express only writes ASSUMED defaults for what it does not ask. You can change depth later."
    input: [choice, text, voice]
    skip_default: "Deep"
    suggest: "Deep if you can stay for the full Guide. Standard if you want every question with a shorter walk. Express if you want speed and will review assumptions."
    writes:
      - "PROJECT.md#interview-depth"

  - id: DP-1.1
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "Do you have a logo?"
    why: "The logo anchors color, type, and tone. A weak mark makes every later choice lean on it."
    input: [upload, text, voice]
    skip_default: "Generate logo concepts in Babel Fish."
    suggest: "Three directions: wordmark, symbol, or combination."
    pushback_if:
      - "it's fine"
      - "raster under 512px"
    follow_ups:
      - id: DP-1.1a
        ask: "Are you happy with it?"
      - id: DP-1.1b
        ask: "Want suggestions or an improved version?"
    levels:
      beginner: explain
      pro: terse
    required_for:
      - babel-fish.logo
    writes:
      - "BRAND.md#logo"
      - "ASSETS.md#logo"

  - id: DP-1.2
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "Which colors do you want, and what should each one mean for this brand?"
    why: "Color psychology research is mixed. A single color does not have one emotion for all cultures, and a chart of meanings is not a brief. Standing apart from competitors matters more than a borrowed meaning."
    input: [text, voice]
    skip_default: "No palette yet. Babel Fish will draft three, with contrast checked."
    suggest: "Three palettes from mood, industry, and competitors, each with a 60-30-10 split."
    pushback_if:
      - "blue"
      - "make it pop"
    writes:
      - "BRAND.md#color"

  - id: DP-1.3
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "Do you have a slogan or tagline?"
    why: "A slogan is the brand in one line. It can wait if the voice is still forming."
    input: [text, voice]
    skip_default: "No slogan yet."
    suggest: "Babel Fish can draft a set across several styles, then you keep five."
    follow_ups:
      - id: DP-1.3a
        ask: "Want suggestions?"
    writes:
      - "BRAND.md#slogan"
      - "VOICE.md#slogans"

  - id: DP-1.4
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "Which images or backgrounds resonate with you? Drop up to 5, or a board link. For each one, say why it resonates and how it feels."
    why: "Mood is evidence. Five images, each with a why, beat a folder of unlabeled pictures."
    input: [upload, text, voice]
    skip_default: "No mood images yet."
    suggest: "Cap the set at 5. One sentence of why for each image."
    pushback_if:
      - "nice pictures"
      - "modern"
    writes:
      - "BRAND.md#mood"
      - "ASSETS.md#mood"

  - id: DP-1.5
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "Do you have fonts in mind, and what kind of letters feel like you?"
    why: "Two families are enough: one for headlines, one for text. The pairing has to survive a real sentence."
    input: [text, voice, upload]
    skip_default: "No type yet. Show the six pairings."
    suggest: "Send screenshots, or set your headline in one of these six pairings: Bebas Neue + Barlow, Space Grotesk + Inter, DM Serif Display + DM Sans, Fraunces + Work Sans, Archivo Black + Archivo, Clash Display + Satoshi."
    follow_ups:
      - id: DP-1.5a
        ask: "Send screenshots of fonts you like, or I can show you pairings"
    writes:
      - "BRAND.md#type"

  - id: DP-1.6
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "How does your company speak to people? If it were a person or an animal, what would it be?"
    why: "A person or an animal is easier to imitate than a pile of adjectives. Optional sliders can place the voice from funny to serious, formal to casual, respectful to irreverent, and enthusiastic to matter-of-fact."
    input: [text, voice]
    skip_default: "A calm, precise person. No animal named."
    suggest: "Name the person or the animal, then name 5 to 10 brands whose voices you trust with your customers."
    pushback_if:
      - "professional"
      - "friendly"
    follow_ups:
      - id: DP-1.6a
        ask: "Which brands' voices do you like? I can suggest 5 to 10 that speak to your customers"
    writes:
      - "VOICE.md#character"

  - id: DP-1.7
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "Why did you build this, and what is the origin story?"
    why: "This is the brand why, the reason the work exists. Deep runs the Why Finder here, along the Golden Circle. Express and Standard keep a one-sentence stub and may defer the long finder to Babel Fish. The site why is a later question."
    input: [text, voice]
    skip_default: "Brand why not stated. One sentence still owed."
    suggest: "One sentence: To [contribution] so that [impact]."
    pushback_if:
      - "to make money"
      - "it felt right"
    follow_ups:
      - id: DP-1.7a
        ask: "Do you understand your why?"
      - id: DP-1.7-finder
        ask: "Let's find it with the Golden Circle"
    required_for:
      - babel-fish.why
    writes:
      - "BRAND.md#why"

  - id: DP-1.8
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "Which brands are like yours, and which unrelated brands do you love?"
    why: "Kindred brands show the neighborhood. Unrelated loves show taste you will not copy line for line."
    input: [text, voice]
    skip_default: "No kindred brands named."
    suggest: "Three brands in your field, and two you love from outside it. Say what you love, not only the name."
    writes:
      - "BRAND.md#kindred"

  - id: DP-1.9
    module: ford-field-notes
    depth: [express, standard, deep]
    ask: "What assets do you already have, and what must never change?"
    why: "Photos, video, copy, real testimonials, certifications, and press go in the inventory. The protected list is the line the build does not cross."
    input: [upload, text, voice]
    skip_default: "No inventory yet. Nothing marked protected."
    suggest: "List what exists, then name the pages, words, or pictures that stay as they are."
    pushback_if:
      - "everything can change"
    writes:
      - "ASSETS.md#inventory"
      - "ASSETS.md#protected"

  - id: DP-2.1
    module: the-question
    depth: [express, standard, deep]
    ask: "Why are you building this website, in one sentence?"
    why: "This is the site why, the job the website is for. The brand why already lives on its own question. A sentence that only says you want to exist online is not a job."
    input: [text, voice]
    skip_default: "Site why not stated. One sentence still owed."
    suggest: "To [help this person do this] so that [this change happens]."
    pushback_if:
      - "to have an online presence"
      - "online presence"
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md"

  - id: DP-2.2
    module: the-question
    depth: [express, standard, deep]
    ask: "What do you hope it accomplishes? What is the one action a visitor should take?"
    why: "One action keeps the page honest. A second action can exist, but it does not get to be the point."
    input: [text, voice]
    skip_default: "One visitor action not named."
    suggest: "Name a verb a visitor can finish in one sitting: book, buy, call, read, register, or reply."
    pushback_if:
      - "everything"
      - "it depends"
    writes:
      - "SITE-BRIEF.md#action"

  - id: DP-2.3
    module: the-question
    depth: [express, standard, deep]
    ask: "What kind of site is this? Pick any that fit: sales, funnel, calls, reservations, sign-ups, portfolio, content, local, event, personal, nonprofit, recruiting, investor, app."
    why: "Multiple types are allowed. Each type has one primary KPI, in words, and one knowledge pack. The packs named for these types include sales-psychology, seo, or ux-conversion. No fake numbers live on the type."
    input: [choice, text]
    skip_default: "No site type chosen."
    suggest: "The engine will offer these types."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#site-types"
      - "KPIS.md#site-types"

  - id: DP-2.4
    module: the-question
    depth: [express, standard, deep]
    ask: "What is the key outcome, and which KPIs matter? How many leads, bookings, or sales a month would make you happy?"
    why: "If you do not know, a four-question helper asks for current numbers, the goal, visitors needed at a stated assumed conversion range, and which page carries it. Ranges are assumptions. Nothing here fills in a rate."
    input: [text, voice]
    skip_default: "KPIs not set. Ranges stay assumptions until you name a goal."
    suggest: "Name the outcome in words, then the count that would count as a good month. Leave the range blank if you do not have one."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "KPIS.md"

  - id: DP-2.5
    module: the-question
    depth: [express, standard, deep]
    ask: "Should it be a funnel, with one offer and one path, a brand experience, with story and world, or a hybrid?"
    why: "A funnel is one offer and one path, short on purpose. A brand experience is story and world, with more than one path, and a hybrid keeps both: an immersive opening plus one path to the offer."
    input: [choice, text, voice]
    skip_default: "Hybrid. An immersive opening and one path to the offer."
    suggest: "Hybrid when the work needs a world and a next step. Funnel when one offer is the whole site. Brand when the visit itself is the point."
    writes:
      - "SITE-BRIEF.md#shape"

  - id: DP-2.6
    module: the-question
    depth: [express, standard, deep]
    ask: "Who is the visitor? Name one specific person: what they want, what they fear, and what device they are on."
    why: "A named person beats a crowd. Want, fear, and device decide the offer, the proof, and how heavy the page can be."
    input: [text, voice]
    skip_default: "Visitor not named. Want, fear, and device still owed."
    suggest: "One person, one want, one fear, and phone or desk."
    pushback_if:
      - "everyone"
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#visitor"

  - id: DP-2.7
    module: the-question
    depth: [express, standard, deep]
    ask: "What do you sell or give away, and why should anyone care?"
    why: "The offer is the thing that changes hands. Caring is the reason this visitor, not a generic one, would stop."
    input: [text, voice]
    skip_default: "Offer not stated."
    suggest: "Name the thing, the price or the gift, and the change it makes for the person in the previous answer."
    pushback_if:
      - "quality"
      - "the best"
    writes:
      - "SITE-BRIEF.md#offer"

  - id: DP-2.8
    module: the-question
    depth: [express, standard, deep]
    ask: "Which pages and sections do you think you need? This list gets fixed later."
    why: "Your list is a starting sketch. The section plan can add, cut, or rename once the offer and the visitor are clear."
    input: [text, voice]
    skip_default: "Page list not stated. The later plan will draft one."
    suggest: "Name the pages you already picture, in the order a visitor would meet them."
    writes:
      - "SITE-BRIEF.md#pages"

  - id: DP-3.1
    module: tools
    depth: [express, standard, deep]
    ask: "Do you want an email intake or a contact form? The default is yes. Which fields, and where should submissions go?"
    why: "A form is the ordinary way a stranger reaches you. Fields and the destination matter more than the widget."
    input: [choice, text, voice]
    skip_default: "Yes. A contact form with name, email, and a message, sent to the site owner."
    suggest: "Yes, with name, email, and a message. Send it to the address you already answer."
    writes:
      - "SITE-BRIEF.md#contact"

  - id: DP-3.2
    module: tools
    depth: [express, standard, deep]
    ask: "Do you sell products on the site? How many, and are they physical, digital, or subscriptions?"
    why: "A payment link or a buy button can ship in the default build. A full store, including a Shopify store with its own catalog and checkout, escalates. It is not the default build."
    input: [choice, text, voice]
    skip_default: "No store. Contact or content only."
    suggest: "Stripe Payment Links or a Shopify Buy Button. A full store escalates."
    pushback_if:
      - "shopify store"
      - "full store"
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#commerce"

  - id: DP-3.3
    module: tools
    depth: [express, standard, deep]
    ask: "Do you need bookings, reservations, or calls?"
    why: "A booking is a different tool from a contact form. The widget should match how the visit is confirmed."
    input: [choice, text, voice]
    skip_default: "No bookings."
    suggest: "Cal.com, Calendly, or a restaurant widget, if a time slot is the action."
    writes:
      - "SITE-BRIEF.md#bookings"

  - id: DP-3.4
    module: tools
    depth: [express, standard, deep]
    ask: "Do you want a newsletter? If yes, which platform: Kit, Mailchimp, MailerLite, Beehiiv, Brevo, Klaviyo, or Hostinger Reach?"
    why: "The platform is a choice, not a guess. The list is the set this Guide knows how to hand off."
    input: [choice, text, voice]
    skip_default: "No newsletter."
    suggest: "Name the platform you already pay for. If you have none, say so and the later plan can compare them."
    writes:
      - "SITE-BRIEF.md#newsletter"

  - id: DP-3.5
    module: tools
    depth: [express, standard, deep]
    ask: "Do you want a blog or another CMS, and do you want to edit the content yourself later?"
    why: "Editing later decides the tool. A folder of files is enough for some people. Others need a desk they can open without a code editor."
    input: [choice, text, voice]
    skip_default: "No blog. No later self-editing."
    suggest: "Content collections if you rarely edit. Keystatic or Sanity if you want a desk of your own."
    writes:
      - "SITE-BRIEF.md#blog-cms"

  - id: DP-3.6
    module: tools
    depth: [express, standard, deep]
    ask: "Do you need video, other media, or a portfolio of work on the site?"
    why: "Media weight and a portfolio grid change the page plan. Say what must be watchable, listenable, or browsable."
    input: [choice, text, voice]
    skip_default: "No video, media library, or portfolio."
    suggest: "Name the pieces you already have, and whether a visitor should watch, listen, or browse."
    writes:
      - "SITE-BRIEF.md#media"

  - id: DP-3.7
    module: tools
    depth: [express, standard, deep]
    ask: "Any special features? For example MLS listings, maps, member areas, a configurator, an editor, a visualization, or something unusual like blockchain."
    why: "Suggest for me proposes features from the site type and the industry. Anything non-standard can look up APIs and MCP servers. Discovery is approval-gated."
    input: [text, voice]
    skip_default: "No special features."
    suggest: "Suggest for me, based on the site type and the industry. Nothing is installed from that pass."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#specials"

  - id: DP-3.8
    module: tools
    depth: [express, standard, deep]
    ask: "Which analytics do you want: Plausible, Umami, or GA4 with consent?"
    why: "Plausible and Umami skip the cookie banner. GA4 needs consent before it runs. Events come from the KPI file, not from a template."
    input: [choice, text, voice]
    skip_default: "Plausible. No cookie banner."
    suggest: "Plausible or Umami when you want a quiet count. GA4 with consent when you already live in that report."
    writes:
      - "SITE-BRIEF.md#analytics"

  - id: DP-3.9
    module: tools
    depth: [express, standard, deep]
    ask: "Which languages or locales should the site speak?"
    why: "A second locale is a real set of pages, not a toggle pasted on at the end."
    input: [text, voice]
    skip_default: "One locale. The language of this interview."
    suggest: "Name each language and the region, if the region changes the offer."
    writes:
      - "SITE-BRIEF.md#locales"

  - id: DP-4.1
    module: vogon-neighbors
    depth: [express, standard, deep]
    ask: "Who are your main competitors? Drop their sites."
    why: "Names and URLs land here. A later pass can read positioning, audience, visual identity, voice, weaknesses, and complaints, then look for the sea of sameness and three white spaces. This question does not crawl."
    input: [text, voice]
    skip_default: "No competitors named."
    suggest: "Three competitors, each with a URL if you have one."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "COMPETITORS.md"

  - id: DP-4.2
    module: vogon-neighbors
    depth: [express, standard, deep]
    ask: "What do they do well that you secretly envy, and what is boring about them?"
    why: "Envy is the part worth learning from. Boredom is the opening. Both need a specific page, line, or habit, not a shrug."
    input: [text, voice]
    skip_default: "No envy and no boredom named."
    suggest: "One envied move and one boring habit, tied to a page you have actually seen."
    pushback_if:
      - "nothing"
      - "they are fine"
    writes:
      - "COMPETITORS.md#envy"

  - id: DP-4.3
    module: vogon-neighbors
    depth: [express, standard, deep]
    ask: "Do you want a blog, and should keyword-based posts be written for you? Bring seed keywords if you have them, including ones competitors already rank for."
    why: "Keywords come from a later crawl, the industry, the SEO pack, and any keyword-tool export you supply. Do not invent search volumes."
    input: [choice, text, voice]
    skip_default: "No blog. No keyword posts."
    suggest: "Yes or no on the blog, then any seeds you already trust. Leave volume blank."
    writes:
      - "SITE-BRIEF.md#keyword-posts"

  - id: DP-4.4
    module: vogon-neighbors
    depth: [express, standard, deep]
    ask: "Where are your customers: a local city, a country, or worldwide?"
    why: "Place decides whether local search and a LocalBusiness description belong on the site."
    input: [choice, text, voice]
    skip_default: "Customers not placed."
    suggest: "Name the city if you serve one, the country if you serve that, or worldwide if the offer travels."
    writes:
      - "SITE-BRIEF.md#where"

  - id: DP-4.5
    module: vogon-neighbors
    depth: [express, standard, deep]
    ask: "Do you have answer-engine goals for Grok, ChatGPT, or Perplexity?"
    why: "Clear entity facts, structured data, and a real FAQ help a machine read the site. This does not promise citations."
    input: [choice, text, voice]
    skip_default: "No answer-engine goal."
    suggest: "Say the goal in your own words. The build can make the facts easy to read. It cannot promise a citation."
    writes:
      - "SITE-BRIEF.md#answer-engines"

  - id: DP-5.1
    module: point-of-view-gun
    depth: [express, standard, deep]
    ask: "Name three to five sites you love, from any industry, and exactly what you love about each: type, scroll, layout, color, motion, or menu."
    why: "Three to five keeps the board small enough to use. The note is the part you love, not the whole site as a costume."
    input: [text, voice]
    skip_default: "No loved sites named."
    suggest: "Three to five URLs. For each, one sentence on the part you would steal the thinking from."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#references"

  - id: DP-5.2
    module: point-of-view-gun
    depth: [express, standard, deep]
    ask: "If you have none, take a guided walk. Each round shows two Godly cards and two Awwwards cards. Say love, meh, or hate, and why."
    why: "The ten-site walk is the gallery instruction, not the saved board. Likes gathered on the walk narrow to three to five before they are saved."
    input: [choice, text, voice]
    skip_default: "No gallery walk."
    suggest: "Repeat the rounds until the likes are enough to narrow, then keep three to five. An offline shortlist can stand in when the galleries are quiet."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#references"

  - id: DP-5.3
    module: point-of-view-gun
    depth: [express, standard, deep]
    ask: "Give the vibe in three words, and three words it must never feel like."
    why: "Three words for the feeling, and three for the feeling to refuse. Empty praise words do not count as a vibe."
    input: [text, voice]
    skip_default: "Vibe not stated. Three words and three never-words still owed."
    suggest: "Three concrete words, then three refusals. If a word could sit on any brand, it is not done."
    pushback_if:
      - "modern"
      - "clean"
      - "professional"
      - "unique"
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#vibe"
      - "VISUAL-DIRECTION.md#vibe"

  - id: DP-5.4
    module: point-of-view-gun
    depth: [express, standard, deep]
    ask: "Visual interview, eight topics in the follow-ups, ending on this: what is the signature moment, the one thing people will screenshot?"
    why: "The eight topics settle type, color, motion, texture, and imagery. The signature moment is the last answer, the one picture a person would send to a friend."
    input: [text, voice]
    skip_default: "No signature moment named."
    suggest: "Answer the topics in order. Stop on one signature moment. A second wow splits the page."
    follow_ups:
      - id: DP-5.4a
        ask: "Five mood words, and three words it must never feel like."
      - id: DP-5.4b
        ask: "Three to five award sites, and exactly which part of each you love."
      - id: DP-5.4c
        ask: "How loud should the headlines be, and how large is the contrast with the body text?"
      - id: DP-5.4d
        ask: "Color temperature: warm, cool, or neutral, and how often the accent shows up?"
      - id: DP-5.4e
        ask: "Motion personality: calm and expensive, snappy and playful, heavy and cinematic, or name another, with a real-world comparison."
      - id: DP-5.4f
        ask: "Texture: flat, film grain, paper, glass, noise, or something physical from this world?"
      - id: DP-5.4g
        ask: "Imagery: photo, illustration, 3D, or video. What light, and what never shows up?"
      - id: DP-5.4h
        ask: "What is the signature moment, the one thing people will screenshot?"
    levels:
      beginner: explain
      pro: terse
    writes:
      - "VISUAL-DIRECTION.md#signature"

  - id: DP-5.5
    module: point-of-view-gun
    depth: [express, standard, deep]
    ask: "Light: dark and moody, bright and airy, or paper and ink?"
    why: "Three lights, shown later as thumbnails. The choice sets the page ground before any palette math."
    input: [choice, text, voice]
    skip_default: "Paper and ink."
    suggest: "Moody for a low room, airy for a bright one, paper for ink on a sheet."
    writes:
      - "VISUAL-DIRECTION.md#light"

  - id: DP-5.6
    module: point-of-view-gun
    depth: [express, standard, deep]
    ask: "Imagery: photography, illustration, 3D, or type-only?"
    why: "The picture system is one of these four. Mixing comes later, and only if this answer cannot carry the page."
    input: [choice, text, voice]
    skip_default: "Photography."
    suggest: "Photography, illustration, 3D, or type-only. Name one primary."
    writes:
      - "VISUAL-DIRECTION.md#imagery"

  - id: DP-6.1
    module: pan-galactic
    depth: [express, standard, deep]
    ask: "Which motion families belong here? Weighted scroll and reveals, headlines that rise line by line, a page that holds while a story plays, sideways scroll, parallax, a film or frame sequence that scrubs with the scroll, a 3D camera path, pages that melt into each other, menus and intro handoffs, pointer reactions, drawn lines and moving illustration, shader grain and glow, particles, a product or a world, physics, ambient video, and optional sound that stays off until asked."
    why: "Families cover research ids A1 through H3, each with a short loop from the pack and a real link. Magnetic buttons are banned, not offered. The walk names one tool in a clause and does not lecture."
    input: [choice, text, voice]
    skip_default: "Reveals and a calm headline. No world, no film, no custom cursor."
    suggest: "The picker would use CSS, GSAP, Three, OGL, Theatre, Motion, anime.js, or vanilla. Magnetic buttons are banned."
    pushback_if:
      - "magnetic buttons"
      - "all of it"
    levels:
      beginner: explain
      pro: terse
    writes:
      - "MOTION.md#families"

  - id: DP-6.2
    module: pan-galactic
    depth: [express, standard, deep]
    ask: "Motion appetite from 1 to 10. 1 is a calm brochure. 10 is a world you move through. Pick a whole number in that range."
    why: "The number caps weight and does not remove libraries from the Guide. A calm brand at the top of the scale gets pushback against the deadline and the visitor device."
    input: [choice, text, voice]
    skip_default: "3. ASSUMED. Polished, not a spectacle."
    suggest: "1 calm brochure, 2 gentle, 3 polished, 4 editorial, 5 expressive, 6 cinematic lite, 7 cinematic, 8 a 3D accent, 9 3D-led, 10 a world."
    pushback_if:
      - "11"
      - "0"
    levels:
      beginner: explain
      pro: terse
    writes:
      - "MOTION.md#appetite"
      - "SITE-BRIEF.md#motion"

  - id: DP-6.3
    module: pan-galactic
    depth: [express, standard, deep]
    ask: "Do you want the whole site to be one continuous film you scroll through, or a branching story where visitors pick paths?"
    why: "Either shape costs build length, weight, a phone fallback, and a crawlable text layer. The words stay in the page so a crawler can read them."
    input: [choice, text, voice]
    skip_default: "Neither. Ordinary pages, not a film and not a branching story."
    suggest: "A scroll film, a branching story, both, or neither."
    writes:
      - "MOTION.md#narrative"
      - "SITE-BRIEF.md#motion-shape"

  - id: DP-6.4
    module: pan-galactic
    depth: [express, standard, deep]
    ask: "Where does 3D come from: none, pre-rendered, CC0, Tripo, Meshy, an upload, or a brief for a human?"
    why: "None stays flat. Pre-rendered keeps the picture and drops the runtime. CC0 models are license-checked and credited. Tripo or Meshy means generated geometry plus cleanup. An upload is your file. A human brief is the slow careful path."
    input: [choice, upload, text, voice]
    skip_default: "None."
    suggest: "None, pre-rendered stills or video, a CC0 library, Tripo, Meshy, upload, or a brief for a human."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "ASSETS.md#3d"
      - "MOTION.md#3d-source"

  - id: DP-6.5
    module: pan-galactic
    depth: [express, standard, deep]
    ask: "For phone visitors, should heavy motion run lighter, or stay calm?"
    why: "A heavy effect needs a phone path. Calm is the default so the small screen does not carry the desktop scene."
    input: [choice, text, voice]
    skip_default: "Calm."
    suggest: "Lighter keeps the idea and sheds weight. Calm swaps the effect for a still."
    writes:
      - "MOTION.md#phone"

  - id: DP-6.6
    module: pan-galactic
    depth: [express, standard, deep]
    ask: "Is anyone in the audience sensitive to motion?"
    why: "Reduced motion is always implemented. This only tunes intensity for everyone else."
    input: [choice, text, voice]
    skip_default: "Reduced motion stays on. Intensity left as designed."
    suggest: "Say yes if large shifts, flashing, or autoplay would be a problem. Reduced motion is implemented either way."
    writes:
      - "MOTION.md#sensitivity"

  - id: DP-7.1
    module: bistromathics
    depth: [express, standard, deep]
    ask: "What is your comfort spend for generated stills and clips on your account?"
    why: "Show the model and the resolution on every line. Do not promise 1080p inside a small cap. Prices live on the cost meter, not in this question. Stop at the cap."
    input: [choice, text, voice]
    skip_default: "$0 DIY. Prompts only."
    suggest: "DIY with prompts you run yourself, a small cap, a middle cap, a large cap, or a custom cap. The meter recomputes when the model or the resolution changes."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#imagine-spend"

  - id: DP-7.2
    module: bistromathics
    depth: [standard, deep]
    ask: "What is the budget for custom 3D generation, if you chose Tripo or Meshy?"
    why: "Only when Tripo or Meshy is the 3D source. Express does not ask this and writes the assumed default. Credits and cleanup still apply."
    input: [text, voice]
    skip_default: "No custom 3D generation budget."
    suggest: "A credit cap, or none."
    writes:
      - "SITE-BRIEF.md#3d-budget"

  - id: DP-7.3
    module: bistromathics
    depth: [express, standard, deep]
    ask: "Pictures: stock, your own, or AI?"
    why: "Stock, pictures you own, or AI. A real person, product, or place is never swapped for a generated stand-in."
    input: [choice, text, voice]
    skip_default: "Own and AI. No stock."
    suggest: "Stock, your own, AI, or a mix you name."
    writes:
      - "ASSETS.md#picture-source"

  - id: DP-8.1
    module: content
    depth: [express, standard, deep]
    ask: "Do you have the copy, or should the Guide write it in your voice for you to approve or reject?"
    why: "Drafts come from the voice file. You approve or reject them. Unseen copy does not ship."
    input: [choice, text, voice]
    skip_default: "Write it in the voice file. Approve or reject."
    suggest: "You bring the copy, or the Guide drafts it for an approve or reject pass."
    writes:
      - "VOICE.md#copy"
      - "SITE-BRIEF.md#copy"

  - id: DP-8.2
    module: content
    depth: [express, standard, deep]
    ask: "What real proof can the site show: testimonials, reviews, numbers, client names, or press?"
    why: "Real proof only. A placeholder is marked TODO and is never invented."
    input: [text, voice, upload]
    skip_default: "No proof yet. Placeholders stay TODO and are never invented."
    suggest: "Only facts you can point at. Leave out anything that is not real."
    pushback_if:
      - "make some up"
      - "placeholder testimonial"
    writes:
      - "SITE-BRIEF.md#proof"

  - id: DP-8.3
    module: content
    depth: [express, standard, deep]
    ask: "If there is a blog, what cadence and which topics?"
    why: "Cadence and topics are yours. A keyword list needs your approval. Do not invent search volumes."
    input: [text, voice]
    skip_default: "No blog cadence."
    suggest: "A rhythm and a short topic list, or none."
    writes:
      - "SITE-BRIEF.md#blog-cadence"

  - id: DP-8.4
    module: content
    depth: [express, standard, deep]
    ask: "Which legal pages do you need, and which claims can you not make?"
    why: "Privacy, terms, and cookies are named here. Health, finance, real estate, and any other regulated claim stay inside what you can say."
    input: [text, voice]
    skip_default: "Privacy and terms. No extra claims named."
    suggest: "Privacy, terms, cookies, and any sentence the business is not allowed to publish."
    writes:
      - "SITE-BRIEF.md#legal"

  - id: DP-9.1
    module: limits
    depth: [express, standard, deep]
    ask: "What is the deadline?"
    why: "The date is checked against motion appetite. A short date and a world-sized site get pushback."
    input: [text, voice]
    skip_default: "No deadline named."
    suggest: "A date, a season, or none."
    writes:
      - "SITE-BRIEF.md#deadline"
      - "PROJECT.md#deadline"

  - id: DP-9.2
    module: limits
    depth: [express, standard, deep]
    ask: "Where should it live? Hostinger is recommended. The other choices are Vercel, Netlify, or Cloudflare, or no idea. Do you own the domain, who is the registrar, and is email on that domain?"
    why: "Hostinger is the recommended word, not a forced value. Vercel, Netlify, and Cloudflare are equal choices. No idea is a complete answer."
    input: [choice, text, voice]
    skip_default: "no idea"
    suggest: "Hostinger, Vercel, Netlify, Cloudflare, or no idea. Add domain and email if you know them."
    levels:
      beginner: explain
      pro: terse
    writes:
      - "SITE-BRIEF.md#hosting"
      - "PROJECT.md#hosting"

  - id: DP-9.3
    module: limits
    depth: [express, standard, deep]
    ask: "Who maintains the site after launch?"
    why: "Someone publishes, renews the name, and answers the form. Name that person."
    input: [text, voice]
    skip_default: "The owner maintains it."
    suggest: "You, a named teammate, or a handoff with no one else assumed."
    writes:
      - "SITE-BRIEF.md#maintainer"

  - id: DP-9.4
    module: limits
    depth: [express, standard, deep]
    ask: "Anything beyond WCAG 2.2 AA?"
    why: "WCAG 2.2 AA is the floor. Extra needs, such as captions or a higher contrast target, are written here."
    input: [text, voice]
    skip_default: "WCAG 2.2 AA. Nothing beyond that named."
    suggest: "Name the extra requirement, or say AA is enough."
    writes:
      - "SITE-BRIEF.md#accessibility"

  - id: DP-9.5
    module: limits
    depth: [express, standard, deep]
    ask: "Anything else the Guide should know?"
    why: "A last open field for a constraint that did not fit another question."
    input: [text, voice]
    skip_default: "Nothing else."
    suggest: "A constraint, a fear, or a fact that would change the brief."
    writes:
      - "SITE-BRIEF.md#notes"
